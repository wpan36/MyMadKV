syntax = "proto3";

package kvstore_service;

service Operation {
    rpc Put(PutRequest) returns (PutReply);
    rpc Swap(SwapRequest) returns (SwapReply);
    rpc Get(GetRequest) returns (GetReply);
    rpc Scan(ScanRequest) returns (ScanReply);
    rpc Delete(DeleteRequest) returns (DeleteReply);
}

// Identifies one mutation request. A client must reuse the same
// client_id and request_id whenever it retries that request.
message RequestHeader {
    string client_id = 1;
    uint64 request_id = 2;
}

message PutRequest {
    string key = 1;
    string new_value = 2;
    RequestHeader header = 3;
}

message PutReply {
    bool found = 1;
}

message SwapRequest {
    string key = 1;
    string new_value = 2;
    RequestHeader header = 3;
}

message SwapReply {
    bool found = 1;
    string old_value = 2;
}

message GetRequest {
    string key = 1;
}

message GetReply {
    bool found = 1;
    string value = 2;
}

message ScanRequest {
    string start_key = 1;
    string end_key = 2;
}

message KVPair {
    string key = 1;
    string value = 2;
}

message ScanReply {
    repeated KVPair list = 1;
}

message DeleteRequest {
    string key = 1;
    RequestHeader header = 2;
}

message DeleteReply {
    bool found = 1;
}
